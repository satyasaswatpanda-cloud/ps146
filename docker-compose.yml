services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data   # MLflow SQLite store + sample/synthetic data persist here
    environment:
      - MLFLOW_ENABLED=1
      # Uncomment to point at the optional services below (both off by default,
      # so `docker compose up` without profiles stays fully offline):
      # - NEO4J_URI=bolt://neo4j:7687
      # - NEO4J_PASSWORD=antardrishti
      # - LOCAL_LLM_URL=http://ollama:11434

  # Next.js investigation dashboard (frontend-next/). Talks only to `app`
  # over /api/* (see frontend-next/next.config.ts) -- no other outbound calls.
  web:
    build:
      context: ./frontend-next
      args:
        - BACKEND_ORIGIN=http://app:8000
    ports:
      - "3000:3000"
    environment:
      - BACKEND_ORIGIN=http://app:8000
    depends_on:
      - app

  # Optional: Neo4j + Graph Data Science for interactive graph exploration
  # (Browser on :7474) AND as an explicit analytics stage in the pipeline
  # (backend/services/neo4j_sync.py: WCC + PageRank via gds.*).
  # Run with: docker compose --profile graphdb up
  # NEO4J_PLUGINS downloads the GDS plugin from Neo4j's plugin registry on
  # first start (needs internet on the host running compose; the `app`
  # container itself never calls out).
  neo4j:
    image: neo4j:5-community
    profiles: ["graphdb"]
    environment:
      - NEO4J_AUTH=neo4j/antardrishti
      - NEO4J_PLUGINS=["graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=gds.*
      - NEO4J_dbms_security_procedures_allowlist=gds.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  # Optional: local LLM server (Ollama) for grounded alert narratives.
  # Run with: docker compose --profile llm up, then `docker compose exec ollama ollama pull llama3.2:3b`
  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  neo4j_data:
  ollama_data:
